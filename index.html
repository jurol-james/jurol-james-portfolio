<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17301C" />
    <script>
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('portfolio-theme')
        } catch {
          // Continue with the operating system preference.
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#171D19'
      })()
    </script>
    <meta
      name="description"
      content="Jurol James R. Cabaluna is a senior software engineer specializing in Java, Spring Boot, React, system integration, and warehouse and logistics platforms."
    />
    <meta name="author" content="Jurol James R. Cabaluna" />

    <meta property="og:url" content="https://jurolc.com/" />

      property="og:description"
      content="Java and Spring Boot engineering, technical leadership, full-stack delivery, and enterprise integration."
